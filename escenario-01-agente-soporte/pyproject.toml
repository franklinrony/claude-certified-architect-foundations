[project]
name = "escenario-01-agente-soporte"
version = "0.1.0"
description = "Escenario 1 CCAR-F. El core corre sin Claude API."
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.30"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
